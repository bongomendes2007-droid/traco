server.port=8000

# H2 (dev) — file-based so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/traco;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=traco
spring.datasource.password=traco
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.jwt.secret=traco-dev-secret-0123456789-abcdef-CHANGE-IN-PROD
app.jwt.expiration-ms=86400000
app.upload.dir=uploads
app.cors.origins=http://localhost:3000,http://localhost:3001,https://traco-uuiu-flame.vercel.app