# Production profile (Postgres managed — Render/Railway/Fly.io)
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${CORS_ORIGINS:https://traco-uuiu-flame.vercel.app}
# Worker CV (serviço traco-ai no Render) — vazio cai no simulador
app.ai.url=${AI_SERVICE_URL:}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never